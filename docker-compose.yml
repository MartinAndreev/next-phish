services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-next_phish}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  next-app:
    build:
      context: .
      dockerfile: apps/next-app/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - SMTP_HOST=fakesmtp
      - DELIVERY_WEBHOOK_SECRET=${DELIVERY_WEBHOOK_SECRET:-development-webhook-secret}
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fakesmtp:
        condition: service_started

  static-server:
    build:
      context: .
      dockerfile: apps/static-server/Dockerfile
      target: dev
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - STATIC_SERVER_PORT=3001
      - PAGE_SUBMISSION_ENCRYPTION_KEY=${PAGE_SUBMISSION_ENCRYPTION_KEY}
      - PUBLIC_CONTENT_URL=${PUBLIC_CONTENT_URL:-http://content.localhost:3001}
      - TRUSTED_PROXY_NETWORKS=${TRUSTED_PROXY_NETWORKS:-}
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - SMTP_HOST=fakesmtp
      - PAGE_SUBMISSION_ENCRYPTION_KEY=${PAGE_SUBMISSION_ENCRYPTION_KEY}
      - PUBLIC_CONTENT_URL=${PUBLIC_CONTENT_URL:-http://content.localhost:3001}
      - MESSAGE_ID_DOMAIN=${MESSAGE_ID_DOMAIN:-mail.example.com}
      - DELIVERY_ENABLED=${DELIVERY_ENABLED:-true}
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fakesmtp:
        condition: service_started

  fakesmtp:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "1080:8025"

volumes:
  postgres-data:
  redis-data:
  app-node-modules:
